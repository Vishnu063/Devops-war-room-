<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaCart Owner Studio</title><link rel="stylesheet" href="./admin.css"></head>
<body>
<header><a href="./index.html">NovaCart</a><span>Owner Studio · Development</span></header>
<main>
<h1>Product management</h1><p>Sign in with an existing owner account to manage your catalog.</p>
<section id="loginPanel"><h2>Owner sign in</h2><form id="loginForm"><label>Email <input name="email" type="email" required></label><label>Password <input name="password" type="password" required></label><button>Sign in</button></form></section>
<section id="workspace" hidden><button id="logout" type="button">Sign out</button><button id="refresh" type="button">Refresh catalog</button><h2>Products</h2><div id="products"></div>
<h2 id="editorTitle">Add product</h2><form id="productForm"><label>Name <input name="name" required></label><label>Slug <input name="slug" required></label><label>Category slug <input name="categorySlug" required></label><label>SKU <input name="sku" required></label><label>Price (INR) <input name="price" type="number" step="0.01" min="0" required></label><label>Stock <input name="stock" type="number" step="1" min="0" required></label><label>Description <textarea name="description"></textarea></label><label>Published <input name="active" type="checkbox"></label><button>Save</button><button type="button" id="cancel">Cancel edit</button></form></section>
<p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="./admin.js"></script></body></html>
