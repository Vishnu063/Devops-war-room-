worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Exclude query strings, auth headers, cookies and payloads from access logs.
  log_format safe '$request_id $request_method $status $request_time';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  client_max_body_size 64k;
  client_body_timeout 15s;
  send_timeout 15s;
  limit_req_zone $binary_remote_addr zone=auth:1m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:1m rate=120r/m;
  limit_req_status 429;
  upstream novacart { server novacart-app:3100; keepalive 8; }
  server {
    listen 8080;
    server_name _;
    location = /proxy-health { access_log off; return 200 'ok'; }
    location / { return 308 NOVACART_ORIGIN$request_uri; }
  }
  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;
    auth_basic "NovaCart internal preview: fictional data only";
    auth_basic_user_file /run/secrets/preview_auth;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      include /etc/nginx/proxy_params_novacart;
    }
    location / {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/proxy_params_novacart;
    }
  }
}
