<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#090e19"/><rect width="1200" height="64" fill="#111d2e"/><text x="45" y="40" font-family="Arial" font-weight="bold" font-size="22" fill="#65e9d2">◈ DEVOPS WAR ROOM</text><rect x="940" y="17" width="220" height="31" rx="15" fill="#183d3d"/><text x="958" y="37" font-family="Arial" font-size="13" fill="#9df6de">● SAFE SIMULATION MODE</text><text x="50" y="112" font-family="Arial" font-size="13" fill="#65e9d2" letter-spacing="3">MISSION CONTROL / INTERVIEW TRAINING</text><text x="50" y="172" font-family="Arial" font-weight="bold" font-size="46" fill="#f0f6ff">Think like an on-call engineer.</text><text x="50" y="207" font-family="Arial" font-size="17" fill="#a6bcd3">Solve production incidents. Practice commands. Learn the root cause.</text><g fill="#111d2e" stroke="#2a405a"><rect x="50" y="235" width="350" height="95" rx="12"/><rect x="420" y="235" width="350" height="95" rx="12"/><rect x="790" y="235" width="360" height="95" rx="12"/><rect x="50" y="350" width="745" height="355" rx="14"/><rect x="815" y="350" width="335" height="355" rx="14"/></g><g font-family="Arial" fill="#a7f7e8" font-size="31" font-weight="bold"><text x="75" y="286">0</text><text x="445" y="286">0/8</text><text x="815" y="286">ROOKIE</text></g><g font-family="Arial" fill="#a3b5cc" font-size="13"><text x="75" y="311">XP EARNED</text><text x="445" y="311">MISSIONS CLEARED</text><text x="815" y="311">ENGINEER RANK</text></g><text x="77" y="392" font-family="Arial" font-size="13" fill="#65e9d2">KUBERNETES</text><text x="77" y="432" font-family="Arial" font-weight="bold" font-size="26" fill="#f0f6ff">CrashLoopBackOff</text><text x="77" y="466" font-family="Arial" font-size="16" fill="#c3d4e8">After a deployment, your application container</text><text x="77" y="491" font-family="Arial" font-size="16" fill="#c3d4e8">repeatedly crashes. What do you investigate first?</text><g fill="#17293d" stroke="#37516a"><rect x="76" y="515" width="685" height="45" rx="9"/><rect x="76" y="570" width="685" height="45" rx="9"/><rect x="76" y="625" width="685" height="45" rx="9"/></g><g font-family="Arial" font-size="14" fill="#e8f2ff"><text x="95" y="544">A. Delete all Pods immediately</text><text x="95" y="599">B. Check status, Events and previous logs</text><text x="95" y="654">C. Increase disk storage without investigating</text></g><text x="843" y="395" font-family="Arial" font-weight="bold" font-size="22" fill="#f0f6ff">Incident queue</text><g font-family="Arial" font-size="15" fill="#c8d9eb"><text x="845" y="443">01  CrashLoopBackOff</text><text x="845" y="482">02  OOMKilled · Exit 137</text><text x="845" y="521">03  ImagePullBackOff</text><text x="845" y="560">04  Running but Not Ready</text><text x="845" y="599">05  RDS Connection Refused</text><text x="845" y="638">06  Security Group vs NACL</text><text x="845" y="677">+ 2 more missions</text></g></svg>